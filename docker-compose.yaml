services:
  web:
    image: vprofile-web:latest
    build: 
      context: ./dockerfiles/web
      dockerfile: v3.Dockerfile
    depends_on:
      - db
      - cache
      - rmq01
    restart: always
  db:
    image: mysql:8.0.45-debian
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=accounts
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  cache:
    image: memcached:1.6.40-alpine
    restart: always
  rmq01:
    image: rabbitmq:4.2.3-alpine
    volumes:
      - ./configs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    restart: always
  lb:
    image: nginx:1.29.4-alpine
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - web
    restart: always

volumes:
  db_data: